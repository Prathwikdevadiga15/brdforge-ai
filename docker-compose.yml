services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brdforge
      POSTGRES_USER: brdforge
      POSTGRES_PASSWORD: brdforge_local
    ports:
      - "5432:5432"
    volumes:
      - brdforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brdforge -d brdforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brdforge-postgres:
